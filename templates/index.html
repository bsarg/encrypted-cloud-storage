<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encrypted Cloud Storage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        body {
            background-color: #1a1a2e;
            color: #e0e0e0;
            font-family: 'Arial', sans-serif;
        }
        .container {
            margin-top: 50px;
        }
        .card {
            background-color: #16213e;
            color: #e0e0e0;
            border-radius: 10px;
            padding: 20px;
        }
        .btn-custom {
            background-color: #0f3460;
            color: #ffffff;
            border-radius: 8px;
        }
        .btn-custom:hover {
            background-color: #007bff;
        }
        .file-list {
            list-style: none;
            padding: 0;
        }
        .file-list li {
            background-color: #0f3460;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .file-list a {
            color: #00a8ff;
            text-decoration: none;
        }
        .file-list a:hover {
            text-decoration: underline;
        }
        .navbar {
            background-color: #0f3460;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">☁ Encrypted Cloud Storage</a>
            <a class="btn btn-danger" href="{{ url_for('auth.logout') }}">Logout</a>
        </div>
    </nav>

    <div class="container text-center">
        <h2 class="mt-4">Secure Cloud Storage</h2>
        <p>Upload your files securely with encryption.</p>

        <!-- Upload File Card -->
        <div class="card mt-4">
            <h4>Upload File</h4>
            <form action="{{ url_for('upload_file') }}" method="post" enctype="multipart/form-data">
                <input class="form-control mb-3" type="file" name="file" required>
                <button class="btn btn-custom w-100" type="submit">
                    <i class="fas fa-upload"></i> Upload File
                </button>
            </form>
        </div>

        <!-- File List -->
        <div class="card mt-4">
            <h4>Your Uploaded Files</h4>
            <ul class="file-list">
                {% for file in files %}
                <li>
                    <span>{{ file["name"] }}</span>
                    <a href="{{ url_for('download_file', file_id=file['id'], filename=file['name']) }}" class="btn btn-sm btn-success">
                        <i class="fas fa-download"></i> Download
                    </a>
                </li>
                {% endfor %}
            </ul>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
